[project]
name = "dbp-metric-computation-walkthrough"
version = "0.1.0"
description = "Executable walkthrough of DBP video metric computations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "dbmetrics",
    "dbstim @ git+https://github.com/StanfordDigitalBrainProject/dbstim.git@6975402207d685d903b77470a3f7fca103fe0e00",
]

[tool.uv]
package = false

[tool.uv.sources]
dbmetrics = { path = "..", editable = true }

[dependency-groups]
vjepa = [
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers==4.57.5",
]
